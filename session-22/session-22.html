<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</head>

<body class="bg-light py-5">
    <div class="container d-flex justify-content-center">
        <div class="card shadow-sm" style="max-width: 28rem; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h3 class="h4 mb-0">Product Feedback</h3>
            </div>

            <div class="card-body p-4">
                <div class="d-grid mb-3">
                    <button class="btn btn-primary" type="button" id="loadproduct">Load Product</button>
                </div>
                <div id="Product" class="mb-4"></div>
                <form id="form-tab">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="yourname">
                        <label for="yourname">Your Name</label>
                        <div id="yourname-error" class="text-danger small mt-1"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <textarea class="form-control" placeholder="Leave your feedback here" id="feedback"
                            style="height: 120px"></textarea>
                        <label for="feedback">Feedback</label>
                        <div id="feedback-error" class="text-danger small mt-1"></div>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-success type= submit" id="sendfeedback">Send Feedback</button>
                    </div>
                </form>
                <div id="feedResult" class="mt-3 text-center" ></div>
            </div>
        </div>
    </div>

    <script src="session-22.js"></script>

</body>

</html>
