<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>

</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h3 class="card-title text-center mb-4">Create Account</h3>
    
    <form id="sign-Up">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name">
        <div id="name-error" class="text-danger small mt-1" ></div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email">
        <div id="email-error" class="text-danger small mt-1"></div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password">
        <div id="password-strog" class="small mt-1"></div>
        <div id="password-error" class="text-danger small mt-1"></div>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirm">
        <div id="confirm-error" class="text-danger small mt-1"></div>

      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2 " id="submit">Sign Up</button>
    </form>
    <div id="create" class=" creation  mt-2"></div>
  </div>
  <script src="session-20.js"></script>
</body>
</html>
</body>
